services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      KAVACH_ENVIRONMENT: production
      KAVACH_JWT_SECRET: ${KAVACH_JWT_SECRET:?Set KAVACH_JWT_SECRET in .env}
      KAVACH_DATABASE_URL: postgresql+psycopg://kavach:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/kavach
      KAVACH_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      KAVACH_CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kavach
      POSTGRES_DB: kavach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - kavach_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach -d kavach"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  kavach_db:
